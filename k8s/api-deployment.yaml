apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # the "app" user from the Dockerfile
      initContainers:
        # Wait for Postgres so the api does not crash-loop while the database starts.
        - name: wait-for-db
          image: pgvector/pgvector:pg16
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
          securityContext:
            runAsUser: 999  # postgres user in this image
      containers:
        - name: api
          # Built locally and loaded into kind: see README, "Kubernetes (kind)".
          image: reformulation-assistant:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Settings from the ConfigMap, DATABASE_URL and API keys from the Secret
          # (both generated by kustomization.yaml). A key absent from the Secret stays unset:
          # /health still works, /ask and /reformulate answer 503 llm_not_configured.
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          # Startup: loading the ONNX model and running migrations takes a few seconds.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # /health returns 503 when the database is down: the pod leaves the Service.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 2
          # Same endpoint, as the spec asks: after ~30 s of 503 the pod is restarted.
          # Trade-off: a database outage also restarts the api, which does not fix the database;
          # a DB-independent /livez would avoid that.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Measured in compose: ~1.1 GiB steady, 1.5 GiB peak while the ONNX model loads
          # (a 1 GiB limit got the pod OOMKilled at startup).
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
