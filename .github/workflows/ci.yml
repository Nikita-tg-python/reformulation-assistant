name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reformulation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reformulation"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # Integration tests in tests/test_api.py run against this database instead of skipping.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reformulation

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating v10 tag upstream (last one is v7)
        with:
          version: "0.8.24"  # same uv as the Dockerfile and Makefile (ghcr.io/astral-sh/uv:0.8)
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Pytest (no LLM keys; network limited to the database by tests/conftest.py)
        shell: bash
        run: |
          set -o pipefail
          uv run --locked pytest -q -rs | tee pytest.log
          # The integration tests must really run here: fail if anything was skipped.
          if grep -qE "[0-9]+ skipped" pytest.log; then
            echo "::error::tests were skipped; DATABASE_URL should make every test run in CI"
            exit 1
          fi

  eval:
    name: RAG eval (recall@5, MRR)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reformulation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reformulation"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reformulation
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating v10 tag upstream (last one is v7)
        with:
          version: "0.8.24"
          python-version: "3.12"
          enable-cache: true

      # Only the files app/embeddings.py downloads (~470 MB): ONNX weights, tokenizer, config.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ env.EMBEDDING_MODEL }}-onnx-v1

      - name: Install dependencies
        run: uv sync --locked

      - name: Eval (fails if recall@5 < 0.8 in any search mode)
        run: uv run --locked python -m eval.run

  k8s:
    name: k8s manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: kubectl kustomize (placeholders only, as in the repo)
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s/ > rendered.yaml
          grep -c "^kind:" rendered.yaml

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: reformulation-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
